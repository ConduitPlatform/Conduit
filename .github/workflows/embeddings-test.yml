name: Embeddings offline tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'modules/embeddings/**'
      - 'libraries/grpc-sdk/**'
      - 'libraries/module-tools/**'
      - '.github/workflows/embeddings-test.yml'
  push:
    branches:
      - main
    paths:
      - 'modules/embeddings/**'
      - 'libraries/grpc-sdk/**'
      - 'libraries/module-tools/**'
      - '.github/workflows/embeddings-test.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-24.04
    name: Embeddings unit and contract tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '29.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build embeddings and workspace dependencies
        run: pnpm exec turbo run build --filter=@conduitplatform/embeddings...

      - name: Run embeddings offline tests
        run: pnpm --filter @conduitplatform/embeddings test
