syntax = 'proto3';
import "google/protobuf/empty.proto";
package database;

message CreateSchemaRequest {
  string name = 1;
  string fields = 2;
  string modelOptions = 3;
  string collectionName = 4;
}

message GetSchemaRequest {
  string schemaName = 1;
}

message GetSchemasRequest {
}

message GetSchemasResponse {
  repeated Schema schemas = 1;
}

message DropCollectionResponse {
  string result = 1;
}

message Schema {
  string name = 1;
  string fields = 2;
  string modelOptions = 3;
  string collectionName = 4;
  string fieldHash = 5;
}

message SchemaExtension {
  string schemaName = 1;
  string fields = 2;
}

message FindOneRequest {
  string schemaName = 1;
  string query = 2;
  optional string select = 3;
  repeated string populate = 4;
  optional string userId = 5;
  optional string scope = 6;
  optional string readPreference = 7;
  // When true, Database verifies the caller is embeddings and restricts the read.
  optional bool embeddingsJob = 8;
  repeated string embeddingsAllowedFields = 9;
}

message FindRequest {
  string schemaName = 1;
  string query = 2;
  optional string select = 3;
  optional int32 skip = 4;
  optional int32 limit = 5;
  map<string, int32> sort = 6; // -1 | 1
  repeated string populate = 7;
  optional string userId = 8;
  optional string scope = 9;
  optional string readPreference = 10;
}

message QueryResponse {
  string result = 1;
}

message QueryRequest {
  string schemaName = 1;
  string query = 2;
  optional string userId = 3;
  optional string scope = 4;
  optional string readPreference = 5;
}

message RawQueryRequest {
  message RawQuery {
    message MongoQuery {
      oneof operation {
        string aggregate = 1;
        string count = 2;
        string deleteOne = 3;
        string deleteMany = 4;
        string drop = 5;
        string explain = 6;
        string find = 7;
        string insertOne = 8;
        string insertMany = 9;
        string updateOne = 10;
        string updateMany = 11;
      }
      optional string options = 12;
    }
    message SQLQuery {
      string query = 1;
      optional string options = 2;
    };
    optional MongoQuery mongoQuery = 1;
    optional SQLQuery sqlQuery = 2;
  };
  string schemaName = 1;
  RawQuery query = 2;
}

message CreateViewRequest {
  message RawQuery {
    string mongoQuery = 1;
    string sqlQuery = 2;
  };
  string schemaName = 1;
  string viewName = 2;
  repeated string joinedSchemas = 3;
  RawQuery query = 4;
}

message DeleteViewRequest {
  string viewName = 1;
}

message UpdateRequest {
  string schemaName = 1;
  string id = 2;
  string query = 3;
  repeated string populate = 4;
  optional string userId = 5;
  optional string scope = 6;
  // When true, skip bus publication. Existing callers omit this and keep publishing.
  optional bool suppressEvent = 7;
  // When true, Database verifies the caller is embeddings and restricts the write.
  optional bool embeddingsJob = 8;
}

message UpdateManyRequest {
  string schemaName = 1;
  string filterQuery = 2;
  string query = 3;
  repeated string populate = 4;
  optional string userId = 5;
  optional string scope = 6;
  // When true, skip bus publication. Existing callers omit this and keep publishing.
  optional bool suppressEvent = 7;
}

message DropCollectionRequest {
  string schemaName = 1;
  bool deleteData = 2;
}

message MigrateRequest {
  string schemaName = 1;
}

message ColumnExistenceRequest {
  string schemaName = 1;
  repeated string columns = 2;
}

message ColumnExistenceResponse {
  bool result = 1;
}

message GetDatabaseTypeResponse {
  string result = 1;
}

message TransactionSupportResponse {
  bool supported = 1;
  // Why transactions are unavailable (e.g. standalone MongoDB).
  optional string message = 2;
}

message TransactionBegin {
  // Maximum lifetime of the transaction. Capped by the Database module's limit.
  optional int32 timeoutMs = 1;
}

message TransactionCommit {
}

message TransactionRollback {
}

// One message per step of an interactive transaction. The first message must be
// `begin`; the stream then carries one operation at a time and ends with `commit`
// or `rollback`. Closing the stream without a commit rolls the transaction back.
message TransactionRequest {
  oneof operation {
    TransactionBegin begin = 1;
    TransactionCommit commit = 2;
    TransactionRollback rollback = 3;
    FindOneRequest findOne = 4;
    FindRequest findMany = 5;
    QueryRequest create = 6;
    QueryRequest createMany = 7;
    QueryRequest deleteOne = 8;
    QueryRequest deleteMany = 9;
    UpdateRequest findByIdAndUpdate = 10;
    UpdateRequest findByIdAndReplace = 11;
    UpdateManyRequest updateMany = 12;
    UpdateManyRequest updateOne = 13;
    UpdateManyRequest replaceOne = 14;
    QueryRequest countDocuments = 15;
  }
}

// One response per request, in order. A failed operation rolls the transaction
// back and ends the stream with the operation's gRPC status.
message TransactionResponse {
  string result = 1;
}

message VectorCapabilitiesRequest {
  optional string schemaName = 1;
}

message VectorCapabilitiesResponse {
  bool supported = 1;
  bool storage = 2;
  bool indexing = 3;
  bool search = 4;
  string provider = 5;
  optional string reason = 6;
}

message VectorIndex {
  string field = 1;
  int32 dimensions = 2;
  string similarity = 3;
  optional string name = 4;
  optional string method = 5;
  repeated string filterFields = 6;
  optional string options = 7;
  optional string status = 8;
  optional bool queryable = 9;
}

message VectorIndexRequest {
  string schemaName = 1;
  VectorIndex index = 2;
}

message VectorIndexListRequest {
  string schemaName = 1;
}

message VectorIndexListResponse {
  repeated VectorIndex indexes = 1;
}

message DeleteVectorIndexRequest {
  string schemaName = 1;
  string indexName = 2;
}

message VectorSearchRequest {
  string schemaName = 1;
  string field = 2;
  repeated double vector = 3;
  optional string indexName = 4;
  optional string filter = 5;
  optional int32 limit = 6;
  optional int32 numCandidates = 7;
  optional string select = 8;
  optional string userId = 9;
  optional string scope = 10;
  // Honored only when the verified caller is a platform operator module.
  optional bool adminOperator = 11;
}

service DatabaseProvider {
  rpc CreateSchemaFromAdapter(CreateSchemaRequest) returns (Schema);
  rpc GetSchema(GetSchemaRequest) returns (Schema);
  rpc GetSchemas(GetSchemasRequest) returns (GetSchemasResponse);
  rpc DeleteSchema(DropCollectionRequest) returns (DropCollectionResponse);
  rpc SetSchemaExtension(SchemaExtension) returns (Schema);
  rpc Migrate(MigrateRequest) returns (google.protobuf.Empty);
  rpc GetDatabaseType(google.protobuf.Empty) returns (GetDatabaseTypeResponse);
  rpc GenerateId(google.protobuf.Empty) returns (GetDatabaseTypeResponse);
  rpc GetTransactionSupport(google.protobuf.Empty) returns (TransactionSupportResponse);
  rpc Transaction(stream TransactionRequest) returns (stream TransactionResponse);
  // Database queries
  rpc findOne(FindOneRequest) returns (QueryResponse);
  rpc findMany(FindRequest) returns (QueryResponse);
  rpc create(QueryRequest) returns (QueryResponse);
  rpc createMany(QueryRequest) returns (QueryResponse);
  rpc deleteOne(QueryRequest) returns (QueryResponse);
  rpc deleteMany(QueryRequest) returns (QueryResponse);
  rpc findByIdAndUpdate(UpdateRequest) returns (QueryResponse);
  rpc findByIdAndReplace(UpdateRequest) returns (QueryResponse);
  rpc updateMany(UpdateManyRequest) returns (QueryResponse);
  rpc updateOne(UpdateManyRequest) returns (QueryResponse);
  rpc replaceOne(UpdateManyRequest) returns (QueryResponse);
  rpc countDocuments(QueryRequest) returns (QueryResponse);
  rpc rawQuery(RawQueryRequest) returns (QueryResponse);
  rpc createView(CreateViewRequest) returns (google.protobuf.Empty);
  rpc deleteView(DeleteViewRequest) returns (google.protobuf.Empty);
  rpc columnExistence(ColumnExistenceRequest) returns (ColumnExistenceResponse);
  rpc getVectorCapabilities(VectorCapabilitiesRequest) returns (VectorCapabilitiesResponse);
  rpc createVectorIndex(VectorIndexRequest) returns (QueryResponse);
  rpc getVectorIndexes(VectorIndexListRequest) returns (VectorIndexListResponse);
  rpc deleteVectorIndex(DeleteVectorIndexRequest) returns (QueryResponse);
  rpc vectorSearch(VectorSearchRequest) returns (QueryResponse);
}
