syntax = "proto3";
package storage;

message GetFileRequest {
  string id = 1;
  optional string userId = 2;
  optional string scope = 3;

}
message GetFileUrlRequest {
  string id = 1;
  optional string userId = 2;
  optional string scope = 3;
  optional bool download = 4;

}
message GetFileUrlResponse {
  string url = 1;
}

message CreateFileRequest {
  optional string name = 1;
  string data = 2;
  bool isPublic = 3;
  optional string folder = 4;
  optional string container = 5;
  optional string mimeType = 6;
  optional string userId = 7;
  optional string scope = 8;
  optional string alias = 9;
}

message UpdateFileRequest {
  string id = 1;
  string data = 2;
  optional string name = 3;
  optional string folder = 4;
  optional string container = 5;
  optional string mimeType = 6;
  optional string userId = 7;
  optional string scope = 8;
  optional string alias = 9;
}

message FileResponse {
  string id = 1;
  string url = 2;
  string name = 3;
  string uri = 4;
  optional string uploadStatus = 5;
  optional int32 size = 6;
  optional string contentVersion = 7;
  optional string container = 8;
  optional string folder = 9;
  optional string mimeType = 10;
}

message GetFileDataResponse {
  string data = 1;
}

message GetFileBytesRequest {
  string id = 1;
  optional string userId = 2;
  optional string scope = 3;
  optional int32 maxBytes = 4;
}

message GetFileBytesResponse {
  bytes data = 1;
  int32 size = 2;
  optional string mimeType = 3;
  optional string name = 4;
  optional string contentVersion = 5;
  optional string container = 6;
  optional string folder = 7;
}
message DeleteFileResponse {
  bool success = 1;
}

message CreateFileByUrlRequest {
  optional string name = 1;
  bool isPublic = 2;
  optional string folder = 3;
  optional string container = 4;
  optional string mimeType = 5;
  optional int32 size = 6; // todo: support int64
  optional string userId = 7;
  optional string scope = 8;
  optional string alias = 9;
}

message FileByUrlResponse {
  string id = 1;
  string fileUrl = 2;
  string name = 3;
  string uploadUrl = 4;
  string uri = 5;
  optional string uploadStatus = 6;
  optional string contentVersion = 7;
  optional int32 size = 8;
}

message UpdateFileByUrlRequest {
  string id = 1;
  optional string name = 2;
  optional string folder = 3;
  optional string container = 4;
  optional string mimeType = 5;
  optional int32 size = 6; // todo: support int64
  optional string userId = 7;
  optional string scope = 8;
  optional string alias = 9;
}

message CompleteFileUploadRequest {
  string id = 1;
  optional string userId = 2;
  optional string scope = 3;
}

service Storage {
  rpc GetFile(GetFileRequest) returns (FileResponse);
  rpc GetFileData(GetFileRequest) returns (GetFileDataResponse);
  rpc GetFileBytes(GetFileBytesRequest) returns (GetFileBytesResponse);
  rpc GetFileUrl(GetFileUrlRequest) returns (GetFileUrlResponse);
  rpc UpdateFile(UpdateFileRequest) returns (FileResponse);
  rpc CreateFile(CreateFileRequest) returns (FileResponse);
  rpc DeleteFile(GetFileRequest) returns (DeleteFileResponse);
  rpc CreateFileByUrl(CreateFileByUrlRequest) returns (FileByUrlResponse);
  rpc UpdateFileByUrl(UpdateFileByUrlRequest) returns (FileByUrlResponse);
  rpc CompleteFileUpload(CompleteFileUploadRequest) returns (FileResponse);
}
