syntax = "proto3";
import "google/protobuf/empty.proto";
package authentication;

// Issues tokens for a user without a login. This is a trusted path: it does not run a
// login strategy and satisfies a realm's requireTwoFa policy without a 2FA step.
message UserLoginRequest {
  string userId = 1;
  string clientId = 2;
  // realm slug the session is bound to; defaults to the user's home realm
  optional string realm = 3;
}

message UserCreateRequest {
  string email = 1;
  optional string password = 2;
  bool verify = 3;
  optional string anonymousId = 4;
  optional string userData = 5;
  optional string realm = 6;
}

message UserCreateByUsernameRequest {
  string username = 1;
  optional string password = 2;
  optional string anonymousId = 3;
  optional string realm = 4;
}

message UserChangePass {
  string email = 1;
  optional string password = 2;
  optional string realm = 3;
}

message UserDeleteRequest {
  string userId = 1;
}

message GetTeamRequest {
  optional string teamId = 1;
}

message CreateTeamRequest {
  string name = 1;
  optional string parentTeam = 2;
  optional bool isDefault = 3;
}

message TeamDeleteRequest {
  string teamId = 1;
}

message UserLoginResponse {
  string accessToken = 1;
  optional string refreshToken = 2;
}

message UserDeleteResponse {
  string message = 1;
}

message UserCreateResponse {
  optional string password = 1;
}

message Team {
  string id = 1;
  string name = 2;
  string parentTeam = 3;
  bool isDefault = 4;
  bool realmEnabled = 5;
  optional string realmSlug = 6;
}

message TeamDeleteResponse {
  string message = 1;
}

message ModifyTeamMembersRequest {
  string teamId = 1;
  repeated string memberIds = 2;
}

message ValidateAccessTokenRequest {
  string accessToken = 1;
  optional string path = 2;
}

message ValidateAccessTokenResponse {
  enum Status {
    AUTHENTICATED = 0;
    UNAUTHENTICATED = 1;
    REQUIRES_2FA = 2;
    USER_BLOCKED = 3;
  }
  Status status = 1;
  optional string userId = 2;
  // slugs; absent for global sessions and global users
  optional string realm = 3;
  optional string homeRealm = 4;
}

message AnonymousUserCreateRequest {
  string clientId = 1;
  optional string realm = 2;
}

message UserModifyStatusRequest {
  string id = 1;
  bool active = 2;
}

message UserModifyStatusResponse {
  string message = 1;
}

message InvitationDeleteRequest {
  string teamId = 1;
  string email = 2;
}

message InvitationDeleteResponse {
  string message = 1;
}

message InviteUserToTeamRequest {
  string teamId = 1;
  string email = 2;
  string role = 3;
  string inviterUserId = 5;
  optional string redirectUri = 4;
  optional string userData = 6;
}

message InviteUserToTeamResponse {
  string invitationToken = 1;
}

message UpdateTeamRequest {
  string teamId = 1;
  optional string name = 2;
  optional string newParentTeamId = 3;
}

message SetTeamRealmRequest {
  string teamId = 1;
  string slug = 2;
  // JSON of the realm settings (strategies, policies, registration, active); may carry secrets
  optional string settingsJson = 3;
  // required to change the slug of an existing realm
  bool force = 4;
}

message GetRealmSettingsRequest {
  string teamId = 1;
}

message RealmResponse {
  Team team = 1;
  // JSON of the masked realm settings, secrets never included
  string settingsJson = 2;
  int32 homeCount = 3;
  int32 guestCount = 4;
}

message UnsetTeamRealmRequest {
  string teamId = 1;
  bool force = 2;
}

message UnsetTeamRealmResponse {
  string message = 1;
  int32 blockedUsers = 2;
}

message RealmMembershipRequest {
  string teamId = 1;
  string userId = 2;
  // 'home' | 'guest', anything else is INVALID_ARGUMENT (ignored by RevokeRealmMembership)
  string type = 3;
  // GrantRealmMembership(home) only: the user already has a different home realm. Without
  // force that is FAILED_PRECONDITION; with it the user is moved and all their tokens are
  // revoked.
  bool force = 4;
}

// Errors raised by the realm RPCs (and the other Authentication RPCs) keep their gRPC
// code. Module errors (REALM_NOT_FOUND, REALM_SLUG_TAKEN, GUESTS_NOT_ALLOWED...) carry
// the message as a JSON string, `{"conduitCode": "...", "message": "..."}`: clients
// should key on conduitCode. GrantRealmMembership(guest) for a user whose home realm is
// that realm, and GrantRealmMembership(home) over a different home realm without force,
// are FAILED_PRECONDITION.
service Authentication {
  rpc UserLogin(UserLoginRequest) returns (UserLoginResponse);
  rpc UserCreate(UserCreateRequest) returns (UserCreateResponse);
  rpc UserCreateByUsername(UserCreateByUsernameRequest) returns (UserCreateResponse);
  rpc UserModifyStatus(UserModifyStatusRequest) returns (UserModifyStatusResponse);
  rpc AnonymousUserCreate(AnonymousUserCreateRequest) returns (UserLoginResponse);
  rpc ChangePass(UserChangePass) returns (UserCreateResponse);
  rpc UserDelete(UserDeleteRequest) returns (UserDeleteResponse);
  rpc GetTeam(GetTeamRequest) returns (Team);
  rpc CreateTeam(CreateTeamRequest) returns (Team);
  rpc TeamDelete(TeamDeleteRequest) returns (TeamDeleteResponse);
  rpc AddTeamMembers(ModifyTeamMembersRequest) returns (google.protobuf.Empty);
  rpc RemoveTeamMembers(ModifyTeamMembersRequest) returns (google.protobuf.Empty);
  rpc ValidateAccessToken(ValidateAccessTokenRequest) returns (ValidateAccessTokenResponse);
  rpc InvitationDelete(InvitationDeleteRequest) returns (InvitationDeleteResponse);
  rpc InviteUserToTeam(InviteUserToTeamRequest) returns (InviteUserToTeamResponse);
  rpc UpdateTeam(UpdateTeamRequest) returns (Team);
  rpc SetTeamRealm(SetTeamRealmRequest) returns (RealmResponse);
  rpc GetRealmSettings(GetRealmSettingsRequest) returns (RealmResponse);
  rpc UnsetTeamRealm(UnsetTeamRealmRequest) returns (UnsetTeamRealmResponse);
  rpc GrantRealmMembership(RealmMembershipRequest) returns (google.protobuf.Empty);
  rpc RevokeRealmMembership(RealmMembershipRequest) returns (google.protobuf.Empty);
}
